<!-- ═══════════════════════════════════════════════════════════════════════════
     PARAMITA · FUNDACIÓN SAKYA
     partials/navbar-publico.html — Navbar público (usuarios sin sesión)
     ───────────────────────────────────────────────────────────────────────────

     CAMBIO FASE 7 · añadido .btn-acceso
     ────────────────────────────────────
     Añadido el círculo .btn-acceso al final del .bar-inner (fuera del .menu)
     para dar entrada al login. Cuando el usuario se autentica, este mismo
     círculo se sustituye por el .avatar-menu del navbar-practicante (misma
     posición, mismo tamaño, misma familia lumínica) — continuidad visual
     entre ambos navbars.

     REORDENACIÓN DEL DOM
     ────────────────────
     El .burger se mueve al final del .bar-inner (antes estaba en 3ª posición).
     El .btn-acceso queda como penúltimo hijo, justo antes del burger, para:
       · En desktop: aparecer al final de la fila, después de los CTAs.
       · En móvil: quedar visible en la barra sin abrir el hamburguesa.

     La reordenación no rompe el sibling selector `.nt:checked ~ .menu`
     porque el input.nt sigue estando ANTES del .menu en el DOM. El label
     .burger[for="nt"] funciona por atributo, no por proximidad.

     Depende de estos CSS del sistema (ya cargados):
       · paramita-bar.css     → contenedor sticky, glass, logo
       · paramita-menu.css    → menú horizontal, links, submenús, caret
       · paramita-cta.css     → .btn-secundario, .btn-primario, .btn-acceso
       · paramita-responsive.css → burger + comportamiento móvil
     ═══════════════════════════════════════════════════════════════════════════ -->

    <!-- ═════════════════════════════════════════════════════════════════
         ACCESO A CUENTA · .btn-acceso · Fase 7
         ─────────────────────────────────────────────────────────────────
         Círculo con silueta de usuario que lleva al login. Cuando el
         practicante inicia sesión, este mismo círculo se sustituye por
         el .avatar-menu del navbar-practicante (Fase 8, pendiente) —
         continuidad visual: la silueta anónima se convierte en el

         en la barra sin necesidad de abrir el hamburguesa (patrón
         consolidado en Notion, Linear, Gmail móvil).

         El tooltip "Entrar" viene del CSS (::after). El aria-label es
         explícito para lectores de pantalla.
         ═════════════════════════════════════════════════════════════════ -->

        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
      </svg>
    </a>
