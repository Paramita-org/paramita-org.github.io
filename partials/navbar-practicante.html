<!-- ═══════════════════════════════════════════════════════════════════════════
     PARAMITA · FUNDACIÓN SAKYA
     partials/navbar-practicante.html — Navbar logueado (usuarios autenticados)
     ───────────────────────────────────────────────────────────────────────────

     Variante hermana de navbar-publico.html para usuarios con sesión iniciada.
     Se sirve en la zona logueada del sitio (paramita.org logueado y/o
     cursos.paramita.org — decisión arquitectónica pendiente con Alberto).

     PRINCIPIOS DE DISEÑO
     ────────────────────
     El practicante ya cruzó el umbral: no necesita las puertas de entrada
     (Meditación, Sobre) ni los CTAs de conversión (Únete, Contribuir).
     El navbar se reorienta hacia SU práctica:

       · MI SENDERO   Dashboard personal — primera entrada, sustituye a
                      Meditación como "puerta ancha" del usuario.
       · CURSOS       Catálogo con estado (inscritos, disponibles, próximos).
       · ACTIVIDADES  Igual que en público (enlace plano).
       · BLOG         Igual que en público (enlace plano).

     Lo que DESAPARECE del navbar público:
       · Meditación   Absorbida por "Mi sendero".
       · Sobre        Al pie o en el menú de cuenta (el practicante ya conoce
                      la institución; no es prioridad en su navegación diaria).

     Lo que se AÑADE:
       · Avatar circular con dropdown — sustituye a los CTAs primario/secundario.
         Contiene: Mi perfil, Ajustes, Cerrar sesión.

     Depende de estos CSS del sistema (ya cargados):
       · paramita-bar.css     → contenedor sticky, glass, logo, burger
       · paramita-menu.css    → menú horizontal, links, submenús, caret

     BORRADOR PROVISIONAL · Fase 8 (pendiente)
     ─────────────────────────────────────────
     El componente .avatar-menu de este archivo requiere:
       1. CSS específico en un futuro paramita-avatar.css (aún no existe).
       2. JS de toggle del dropdown (paramita-avatar.js).
       3. Datos reales de sesión desde el LMS (Alberto).

     Mientras el CSS del avatar no exista, este bloque renderiza sin estilos
     completos — es referencia estructural, no producción.

     TEMPLATING · variables a rellenar en cada render
     ────────────────────────────────────────────────
     {{USUARIO_NOMBRE}}     Nombre visible del practicante (ej. "Jana")
     {{USUARIO_INICIAL}}    Inicial mayúscula (ej. "J") — fallback si no hay foto
     {{USUARIO_AVATAR_URL}} URL de la foto de perfil (opcional)
     {{USUARIO_MI_CURSO}}   Slug del curso activo (ej. "emi-1") — para "Continuar"
     ═══════════════════════════════════════════════════════════════════════════ -->
