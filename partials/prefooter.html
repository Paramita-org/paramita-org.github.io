<!-- prefooter · sincronizado con partials/prefooter.html -->
<!-- Banda de suscripción (Fase 8) · zona azul con lotos + componente .suscribe.
     Se inyecta antes del footer en las páginas marcadas `prefooter`.
     COPY PROVISIONAL. El estilado sobre azul vive en paramita-footer.css
     (.foot__hero .suscribe). El endpoint del formulario lo conecta el backend. -->
<section class="foot__hero" aria-labelledby="prefooter-titulo">
  <canvas class="foot__canvas" id="physics" aria-hidden="true"></canvas>
  <div>
    <span class="eyebrow">Camina cerca</span>
    <h2 class="foot__h" id="prefooter-titulo">Recibe inspiración y <em>sabiduría</em>.</h2>
    <p class="foot__nl-sub">Ideas sencillas, propuestas de práctica y noticias de Paramita, de vez en cuando, en tu correo.</p>

    <form class="suscribe" novalidate>
      <div class="suscribe__fila">
        <input class="suscribe__input" name="email" type="email"
               autocomplete="email" aria-label="Correo electrónico"
               placeholder="Tu dirección de correo" required>
        <button class="btn-primario suscribe__btn" type="submit">Suscribirme</button>
      </div>
      <label class="suscribe__consent">
        <input type="checkbox" required>
        <span>Acepto las <a href="/politica-de-privacidad/" target="_blank" rel="noopener">políticas de privacidad</a> y recibir la newsletter de Paramita.</span>
      </label>
      <p class="suscribe__ok" role="status" aria-live="polite">Gracias. Te has suscrito correctamente.</p>
    </form>
  </div>
</section>
